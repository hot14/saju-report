<!DOCTYPE html>

<style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #ffffff;
            color: #111111;
        }
        
        .grid-bg {
            background-image: 
                linear-gradient(to right, #eeeeee 1px, transparent 1px),
                linear-gradient(to bottom, #eeeeee 1px, transparent 1px);
            background-size: 20px 20px; /* 4-column fluid mobile grid proxy */
            opacity: 0.5;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
        }

        .hairline-b { border-bottom: 0.5px solid #111111; }
        .hairline-t { border-top: 0.5px solid #111111; }
        .hairline-l { border-left: 0.5px solid #111111; }
        .hairline-r { border-right: 0.5px solid #111111; }

        .progress-bar {
            width: 37.5%; /* 3/8 */
            background-color: #111111;
            height: 2px;
            transition: width 0.5s ease-in-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col relative overflow-hidden selection:bg-on-background selection:text-background">
<div class="grid-bg pointer-events-none"></div>
<!-- Main Content Area (Mobile Focused) -->
<main class="flex-grow flex flex-col px-margin-mobile pt-margin-mobile pb-margin-mobile max-w-md mx-auto w-full z-10 relative">
<!-- Header Section -->
<header class="mb-12">
<div class="font-data-mono text-label-caps text-on-surface-variant uppercase mb-4 hairline-b pb-2 flex justify-between">
<span>도판 03 - 해석</span>
<span>SYS.LOG.V1</span>
</div>
<h1 class="font-korean-headline font-bold text-4xl leading-[1.1] tracking-tight mb-6">
                짧은 영상이 오늘의 여덟 글자를 보여줍니다<span class="text-secondary">.</span>
</h1>
<p class="font-korean-body font-normal text-lg text-on-surface-variant max-w-[90%]">
                SAJU는 그 글자가 만드는 평생의 패턴을 읽습니다.
            </p>
</header>
<!-- Progress/Analysis Section -->
<section class="flex-grow flex flex-col justify-center">
<div class="mb-8 font-data-mono text-label-caps uppercase flex justify-between items-end">
<span>ANALYZING</span>
<span class="text-lg">3/8</span>
</div>
<!-- 8 Letter Slots (4x2 Grid) -->
<div class="grid grid-cols-4 gap-0 border border-primary w-full">
<!-- Slot 1 (Filled) -->
<div class="aspect-square flex items-center justify-center hairline-r hairline-b bg-surface-container-low">
<span class="font-korean-headline text-3xl font-bold">甲</span>
</div>
<!-- Slot 2 (Filled) -->
<div class="aspect-square flex items-center justify-center hairline-r hairline-b bg-surface-container-low">
<span class="font-korean-headline text-3xl font-bold">丙</span>
</div>
<!-- Slot 3 (Filled) -->
<div class="aspect-square flex items-center justify-center hairline-r hairline-b bg-surface-container-low">
<span class="font-korean-headline text-3xl font-bold">壬</span>
</div>
<!-- Slot 4 (Empty) -->
<div class="aspect-square flex items-center justify-center hairline-b relative">
<div class="w-1/2 h-[1px] bg-outline-variant absolute bottom-1/4"></div>
</div>
<!-- Row 2 -->
<!-- Slot 5 (Empty) -->
<div class="aspect-square flex items-center justify-center hairline-r relative">
<div class="w-1/2 h-[1px] bg-outline-variant absolute bottom-1/4"></div>
</div>
<!-- Slot 6 (Empty) -->
<div class="aspect-square flex items-center justify-center hairline-r relative">
<div class="w-1/2 h-[1px] bg-outline-variant absolute bottom-1/4"></div>
</div>
<!-- Slot 7 (Empty) -->
<div class="aspect-square flex items-center justify-center hairline-r relative">
<div class="w-1/2 h-[1px] bg-outline-variant absolute bottom-1/4"></div>
</div>
<!-- Slot 8 (Empty) -->
<div class="aspect-square flex items-center justify-center relative">
<div class="w-1/2 h-[1px] bg-outline-variant absolute bottom-1/4"></div>
</div>
</div>
<!-- Progress Rule -->
<div class="mt-8 w-full h-[1px] bg-surface-container-high relative">
<div class="progress-bar absolute left-0 top-[-0.5px]"></div>
</div>
<!-- Analyzing Details (Faux Terminal Output) -->
<div class="mt-4 font-data-mono text-label-caps text-outline flex flex-col gap-1">
<div class="flex justify-between"><span>[OK] PATTERN.MATCH</span> <span>100ms</span></div>
<div class="flex justify-between text-on-surface"><span>[*] EXTRACTING.NODE.04</span> <span>WAIT</span></div>
</div>
</section>
<!-- Footer Section -->
<footer class="mt-12 hairline-t pt-4">
<p class="font-korean-body text-body-sm text-on-surface-variant mb-4">
                SAJU는 자기이해를 위한 리딩 도구입니다. 의료·법률·재정 조언이 아닙니다.
            </p>
<div class="flex gap-4 font-data-mono text-label-caps">
<a class="text-on-surface hover:text-secondary underline decoration-1 underline-offset-4" href="#">개인정보처리방침</a>
<a class="text-on-surface hover:text-secondary underline decoration-1 underline-offset-4" href="#">서비스 이용약관</a>
</div>
</footer>
</main>
<script>
        // Simple faux-loading interaction
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.querySelector('.progress-bar');
            const analyzingText = document.querySelector('.text-lg');
            let progress = 3;
            
            setInterval(() => {
                if(progress < 8) {
                    progress++;
                    progressBar.style.width = `${(progress/8)*100}%`;
                    analyzingText.textContent = `${progress}/8`;
                } else {
                    progress = 1;
                    progressBar.style.width = `${(progress/8)*100}%`;
                    analyzingText.textContent = `${progress}/8`;
                }
            }, 2000);
        });
    </script>
</body></html>
