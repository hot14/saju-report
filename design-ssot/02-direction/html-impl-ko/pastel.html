<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;background:#EFE9F7;color:#2D2A3E;font-family:'Gowun Dodum','Apple SD Gothic Neo','Plus Jakarta Sans','Apple SD Gothic Neo','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
.wordmark{font-weight:800;font-size:15px;letter-spacing:.06em}
.lang{font-size:11px;color:#9B8EB5}
.hero{padding:36px 20px 24px;text-align:center}
.hero .badge-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:24px;padding:8px 18px;box-shadow:0 2px 12px rgba(80,50,120,.08);margin-bottom:20px}
.hero .badge-chip .dot{width:10px;height:10px;border-radius:50%;background:#A8C3A0}
.hero .badge-chip .name{font-size:12px;font-weight:700;color:#5B4A8A}
.hero h1{font-size:32px;font-weight:800;line-height:1.15;letter-spacing:-.02em;color:#2D2A3E}
.hero .sub{font-size:14px;color:#7B6F93;margin-top:10px;line-height:1.6}
.cta{display:inline-block;margin-top:24px;background:#7C5CBF;color:#fff;padding:16px 40px;border-radius:28px;font-size:15px;font-weight:700;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(124,92,191,.3)}
.badges{padding:20px;background:#fff;border-radius:20px;margin:20px;border:1px solid #E8E0F5}
.badges .label{font-size:11px;letter-spacing:.1em;color:#9B8EB5;margin-bottom:12px;font-weight:600}
.badge-row{display:flex;gap:10px;justify-content:center}
.badge{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:300}
.badge.b1{background:#A8C3A0}.badge.b2{background:#8B7BB8}.badge.b3{background:#D98E73}
.card-preview{padding:24px 20px}
.card-preview .head{font-size:20px;font-weight:800;margin-bottom:4px}
.card-preview .cap{font-size:13px;color:#9B8EB5}
.closing{padding:32px 20px;text-align:center;background:#fff;border-radius:20px;margin:20px;border:1px solid #E8E0F5}
.closing h3{font-size:18px;font-weight:800}
.closing .cta2{display:inline-block;margin-top:16px;background:#7C5CBF;color:#fff;padding:14px 36px;border-radius:28px;font-size:14px;font-weight:700;border:none}
.foot{padding:16px 20px;text-align:center;font-size:10.5px;color:#B0A5C7;line-height:1.6}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600;900&family=Gowun+Dodum&family=Black+Han+Sans&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="top"><div class="wordmark">SAJU</div><div class="lang">EN ▾</div></div>
<div class="hero">
  <div class="badge-chip"><div class="dot"></div><div class="name">거울 호수</div></div>
  <h1>당신은 거울 호수입니다.</h1>
  <div class="sub">짧은 영상이 오늘의 여덟 글자를 보여줍니다. SAJU는 그 글자가 만드는 평생의 패턴을 읽습니다.</div>
  <button class="cta">내 패턴 읽기</button>
</div>
<div class="badges">
  <div class="label">열 가지 형태</div>
  <div class="badge-row">
    <div class="badge b1">壬</div>
    <div class="badge b2">甲</div>
    <div class="badge b3">丙</div>
  </div>
</div>
<div class="card-preview">
  <div class="head">결과는 단 하나의 카드로 남습니다.</div>
  <div class="cap">배지와 한 줄이 그 자체로 의미를 전달합니다.</div>
</div>
<div class="closing">
  <h3>당신의 리딩은 여덟 글자로 시작됩니다.</h3>
  <button class="cta2">내 패턴 읽기</button>
</div>
<div class="foot">SAJU는 자기이해를 위한 리딩 도구입니다. 의료·법률·재정 조언이 아닙니다.</div>
</body>
</html>
