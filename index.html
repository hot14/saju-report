const catCls = c => ({'부동산':'realty','금융':'finance','뉴스':'news','데이터':'data'}[c] || 'default');
const entries = CATALOG.entries;

// 통계
document.getElementById('nTotal').textContent = entries.length;
document.getElementById('nCat').textContent = new Set(entries.map(e=>e.category)).size;
document.getElementById('nFile').textContent = entries.reduce((a,e)=>a+Object.keys(e.files).length,0);
document.getElementById('upd').textContent = CATALOG.updated;

// 카테고리 칩
const cats = ['전체', ...new Set(entries.map(e=>e.category))];
let curCat = '전체';
document.getElementById('cats').innerHTML = cats.map((c,i)=>`<button class="chip${i===0?' on':''}" data-c="${c}">${c}</button>`).join('');

function fileLabel(k){
  return {report:'리포트 열기', xlsx:'엑셀', raw:'원본데이터', evidence:'증빙'}[k] || k;
}
function fileCls(k){ return {report:'', xlsx:'x', raw:'c', evidence:'e'}[k] || ''; }

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = entries.filter(e=>{
    if(curCat !== '전체' && e.category !== curCat) return false;
    if(!q) return true;
    const hay = [e.title, e.summary, e.source, ...(e.tags||[]), ...(e.highlights||[])].join(' ').toLowerCase();
    return hay.includes(q);
  });
  document.getElementById('grid').innerHTML = list.length ? list.map(e=>`
    <div class="card">
      <div class="top"><span class="badge ${catCls(e.category)}">${e.category}</span><span class="date">${e.date}</span></div>
      <h2><a href="${e.files.report}" target="_blank">${e.title}</a></h2>
      <div class="src">${e.source}</div>
      <p>${e.summary}</p>
      <div class="hl">${(e.highlights||[]).map(h=>`<span>${h}</span>`).join('')}</div>
      <div class="files">${Object.entries(e.files).map(([k,v])=>`<a class="fl ${fileCls(k)}" href="${v}" target="_blank">${fileLabel(k)}</a>`).join('')}</div>
    </div>`).join('')
  : `<div class="empty"><b>조건에 맞는 리포트가 없습니다</b>다른 검색어나 카테고리를 시도해보세요</div>`;
}
document.getElementById('cats').addEventListener('click',e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  document.querySelectorAll('#cats .chip').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); curCat = b.dataset.c; render();
});
document.getElementById('q').addEventListener('input', render);
render();
</script>
