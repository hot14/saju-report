<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;background:#F4F1EC;color:#111;font-family:'Black Han Sans','Archivo Black','Noto Sans KR','Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:3px solid #111}
.wordmark{font-weight:900;font-size:18px;letter-spacing:-.02em}
.no{font-family:'Courier New',monospace;font-size:10px;color:#666}
.hero{padding:36px 20px 28px;border-bottom:3px solid #111}
.stamp{display:inline-block;font-family:'Courier New',monospace;font-size:10px;border:2px solid #111;padding:3px 10px;transform:rotate(-2deg);margin-bottom:16px}
h1{font-size:52px;font-weight:900;letter-spacing:-.03em;line-height:.95;text-transform:uppercase}
h1 .orange{color:#FF4D00}
.sub{font-family:'Noto Sans KR','Apple SD Gothic Neo','Helvetica Neue',sans-serif;font-size:14px;color:#555;margin-top:12px;line-height:1.6}
.cta{display:inline-block;margin-top:24px;background:#FF4D00;color:#fff;padding:16px 36px;font-size:15px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;border:3px solid #111;box-shadow:6px 6px 0 #111;cursor:pointer}
.cta:active{transform:translate(3px,3px);box-shadow:3px 3px 0 #111}
.badges{padding:28px 20px;border-bottom:3px solid #111}
.badges .label{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.15em;font-weight:700;margin-bottom:14px}
.badge-row{display:flex;gap:12px}
.badge{flex:1;border:3px solid #111;background:#fff;padding:14px 8px;text-align:center;box-shadow:4px 4px 0 #111}
.badge .hanja{font-size:30px}
.badge .name{font-family:'Courier New',monospace;font-size:9px;letter-spacing:.1em;margin-top:8px;font-weight:700}
.card-preview{padding:28px 20px;border-bottom:3px solid #111}
.card-preview .head{font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
.card-preview .cap{font-size:13px;color:#666;margin-top:4px;font-family:'Noto Sans KR','Apple SD Gothic Neo','Helvetica Neue',sans-serif}
.closing{padding:36px 20px;text-align:center;background:#111;color:#F4F1EC}
.closing h2{font-size:28px;font-weight:900;text-transform:uppercase;letter-spacing:-.02em}
.closing .cta2{display:inline-block;margin-top:18px;background:#FF4D00;color:#fff;padding:14px 32px;font-size:14px;font-weight:900;text-transform:uppercase;border:2px solid #F4F1EC}
.foot{padding:16px 20px;font-size:10.5px;color:#888;border-top:3px solid #111;font-family:'Courier New',monospace}
</style>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600;900&family=Gowun+Dodum&family=Black+Han+Sans&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="top"><div class="wordmark">SAJU.</div><div class="no">NO. 000847</div></div>
<div class="hero">
  <div class="stamp">SAJU READING NO.1</div>
  <h1>You are<br><span class="orange">Mirror</span><br>Lake.</h1>
  <div class="sub">짧은 영상이 오늘의 여덟 글자를 보여줍니다. SAJU는 그 글자가 만드는 평생의 패턴을 읽습니다.</div>
  <button class="cta">내 패턴 읽기</button>
</div>
<div class="badges">
  <div class="label">열 가지 형태</div>
  <div class="badge-row">
    <div class="badge"><div class="hanja">壬</div><div class="name">거울 호수</div></div>
    <div class="badge"><div class="hanja">甲</div><div class="name">깊은 심목</div></div>
    <div class="badge"><div class="hanja">丙</div><div class="name">정오 표식</div></div>
  </div>
</div>
<div class="card-preview">
  <div class="head">결과는 단 하나의 카드로 남습니다.</div>
  <div class="cap">배지와 한 줄이 그 자체로 의미를 전달합니다.</div>
</div>
<div class="closing">
  <h2>Your reading<br>begins with<br>eight letters.</h2>
  <button class="cta2">내 패턴 읽기</button>
</div>
<div class="foot">SAJU는 자기이해를 위한 리딩 도구입니다. 의료·법률·재정 조언이 아닙니다.</div>
</body>
</html>
